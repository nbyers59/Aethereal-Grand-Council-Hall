<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#030711">
  <title>Aethereal — Grand Council Hall</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    :root{color-scheme:dark;--ink:#eaf5ff;--muted:#91a7c0;--aqua:#57f5e2}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030711;color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
    #desktop-ui{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 15%,#18265033,transparent 36%)}.brand{position:absolute;top:24px;left:28px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}.brand i{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--aqua);box-shadow:0 0 18px var(--aqua)}
    .status{position:absolute;top:22px;right:25px;padding:8px 11px;border:1px solid #29415f;border-radius:999px;color:var(--muted);background:#08111ddd;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.status b{color:var(--aqua)}.hint{position:absolute;bottom:23px;left:50%;transform:translateX(-50%);max-width:680px;padding:10px 16px;text-align:center;color:#c5d6e8;background:#08111ddd;border:1px solid #203954;border-radius:10px;backdrop-filter:blur(10px);font-size:12px}.desktop-actions{position:absolute;bottom:25px;right:27px;display:flex;gap:8px;pointer-events:auto}button{border:1px solid #315271;border-radius:8px;padding:10px 13px;color:var(--ink);background:#0b1a2acc;font:600 12px inherit;cursor:pointer}button:hover{border-color:var(--aqua);color:var(--aqua)}#enter{border-color:#4ccfc5;background:linear-gradient(135deg,#11676b,#29386e);box-shadow:0 0 24px #35c3be33}#toast{position:absolute;left:50%;top:62px;transform:translate(-50%,-8px);opacity:0;transition:.25s;padding:9px 14px;border:1px solid #376089;border-radius:8px;background:#091525ef;color:#d7eaff;pointer-events:none}#toast.show{transform:translate(-50%,0);opacity:1}body.vr-active #desktop-ui{display:none}@media(max-width:600px){.hint{bottom:78px;left:16px;right:16px;transform:none}.brand{left:18px;top:17px}.status{right:16px;top:14px}}
  </style>
</head>
<body>
  <div id="desktop-ui" aria-live="polite"><div class="brand"><i></i>Aethereal / Grand Council Hall</div><div class="status">XR: <b id="xr-state">checking</b></div><div id="toast" role="status"></div><div class="hint">Move freely: <b>WASD</b> + mouse on desktop; use either Quest thumbstick in VR. Your chair is at the head of the table. Follow the glowing halls to the wings or the endless server archive.</div><div class="desktop-actions"><button id="reset">Return to chair</button><button id="enter">Enter VR</button></div></div>
  <a-scene id="space" renderer="colorManagement:true;physicallyCorrectLights:true" vr-mode-ui="enabled:true" webxr="requiredFeatures:local-floor;optionalFeatures:bounded-floor,hand-tracking,layers" background="color:#030711">
    <a-assets timeout="10000"><a-mixin id="screen" geometry="primitive:plane;width:1.3;height:.76" material="color:#07182b;metalness:.35;roughness:.4;emissive:#0b4253;emissiveIntensity:.28" animation__hoverin="property:scale;to:1.06 1.06 1.06;startEvents:mouseenter;dur:160" animation__hoverout="property:scale;to:1 1 1;startEvents:mouseleave;dur:160"></a-mixin></a-assets>
    <a-entity id="rig" position="0 0 5.7" free-roam="speed:3.1"><a-camera id="head" position="0 1.62 0" look-controls="pointerLockEnabled:false" wasd-controls="enabled:false"><a-cursor raycaster="objects:.interactable" fuse="true" fuse-timeout="1200" material="color:#57f5e2;shader:flat" geometry="primitive:ring;radiusInner:.009;radiusOuter:.015"></a-cursor></a-camera><a-entity id="left-hand" laser-controls="hand:left" raycaster="objects:.interactable;far:18" line="color:#57f5e2;opacity:.82"></a-entity><a-entity id="right-hand" laser-controls="hand:right" raycaster="objects:.interactable;far:18" line="color:#9a78ff;opacity:.82"></a-entity></a-entity>
    <a-entity light="type:ambient;intensity:.26;color:#9cb8ff"></a-entity><a-entity light="type:point;intensity:2.8;distance:19;color:#56dfe9" position="0 8 1"></a-entity><a-entity light="type:point;intensity:2;distance:18;color:#8765ff" position="-7 4 -8"></a-entity><a-entity light="type:point;intensity:1.5;distance:16;color:#08788a" position="8 3 -6"></a-entity>
    <!-- Main vaulted council chamber -->
    <a-entity geometry="primitive:box;width:52;height:.12;depth:160" material="color:#061326;metalness:.65;roughness:.3" position="0 -.06 -69"></a-entity><a-entity geometry="primitive:box;width:22;height:8;depth:.12" material="color:#050e1e;metalness:.4;roughness:.6" position="0 4 -12"></a-entity><a-entity id="hall-architecture"></a-entity><a-entity id="wing-rooms"></a-entity><a-entity id="server-archive"></a-entity><a-entity geometry="primitive:ring;radiusInner:8.9;radiusOuter:8.95" rotation="-90 0 0" material="color:#135371;emissive:#0d91a4;emissiveIntensity:.35" position="0 .012 -3.4"></a-entity>
    <a-entity text="value:AETHEREAL COUNCIL HALL;align:center;color:#e5fbff;width:6;letterSpacing:.12" position="0 5.8 -8.8"></a-entity><a-entity text="value:THE LONG TABLE · EIGHT COMMAND STATIONS;align:center;color:#57f5e2;width:5;letterSpacing:.08" position="0 5.35 -8.8"></a-entity>
    <!-- Station 01 is the grand chair at the near head; 02–08 line the table. -->
    <a-entity id="table" position="0 .72 -4.2"><a-entity geometry="primitive:box;width:4.4;height:.28;depth:9.8" material="color:#102b42;metalness:.86;roughness:.23"></a-entity><a-entity geometry="primitive:box;width:3.82;height:.075;depth:9.15" material="color:#082238;emissive:#087a86;emissiveIntensity:.24" position="0 .18 0"></a-entity><a-entity geometry="primitive:box;width:.08;height:.035;depth:8.9" material="color:#57f5e2;emissive:#57f5e2;emissiveIntensity:.75" position="0 .24 0"></a-entity><a-entity id="stations"></a-entity></a-entity>
    <a-entity id="grand-chair" position="0 0 5.25" rotation="0 180 0"><a-entity geometry="primitive:box;width:1.45;height:2.45;depth:.32" material="color:#142f52;metalness:.75;roughness:.22" position="0 1.34 .35"></a-entity><a-entity geometry="primitive:box;width:1.65;height:.22;depth:1.25" material="color:#18395f;metalness:.75;roughness:.22" position="0 .68 -.15"></a-entity><a-entity geometry="primitive:box;width:.16;height:1.35;depth:.9" material="color:#245073;emissive:#0d8a9d;emissiveIntensity:.22" position="-.88 1.1 -.15"></a-entity><a-entity geometry="primitive:box;width:.16;height:1.35;depth:.9" material="color:#245073;emissive:#0d8a9d;emissiveIntensity:.22" position=".88 1.1 -.15"></a-entity><a-entity text="value:01 · YOUR COMMAND SEAT;align:center;color:#57f5e2;width:2.4" position="0 2.82 .2"></a-entity></a-entity>
    <!-- Walkable exits to both control wings and the deep server archive -->
    <a-entity class="interactable destination" data-destination="West control room" position="-10 2.25 -4" rotation="0 90 0"><a-entity mixin="screen"></a-entity><a-entity text="value:WEST WING\nOBSERVATION CONTROL\n\nWALK THROUGH THE HALL;align:center;color:#bdeeff;width:1.18;lineHeight:1.3" position="0 .05 .02"></a-entity></a-entity><a-entity class="interactable destination" data-destination="East control room" position="10 2.25 -4" rotation="0 -90 0"><a-entity mixin="screen"></a-entity><a-entity text="value:EAST WING\nSYSTEMS CONTROL\n\nWALK THROUGH THE HALL;align:center;color:#bdeeff;width:1.18;lineHeight:1.3" position="0 .05 .02"></a-entity></a-entity><a-entity class="interactable destination" data-destination="Server archive" position="0 2.25 -13.3"><a-entity mixin="screen"></a-entity><a-entity text="value:ARCHIVE CORRIDOR\nENDLESS SERVER HALL\n\nWALK FORWARD;align:center;color:#bdeeff;width:1.18;lineHeight:1.3" position="0 .05 .02"></a-entity></a-entity><a-entity text="value:WEST CONTROL WING  ←;align:center;color:#57f5e2;width:4;letterSpacing:.08" position="-9.7 3.45 -4" rotation="0 90 0"></a-entity><a-entity text="value:→  EAST CONTROL WING;align:center;color:#57f5e2;width:4;letterSpacing:.08" position="9.7 3.45 -4" rotation="0 -90 0"></a-entity>
    <!-- Builder Console: point and trigger each command in VR, or click it on desktop. -->
    <a-entity id="builder-console" position="-5.65 2.05 3.35" rotation="0 34 0"><a-entity geometry="primitive:plane;width:3.15;height:3.65" material="color:#07182b;metalness:.4;roughness:.35;emissive:#063848;emissiveIntensity:.2"></a-entity><a-entity text="value:BUILDER CONSOLE;align:center;color:#57f5e2;width:2.75;letterSpacing:.1" position="0 1.42 .02"></a-entity><a-entity text="value:Create locally · select a piece · reshape your hall;align:center;color:#b8d7e7;width:2.65;lineHeight:1.25" position="0 1.08 .02"></a-entity><a-entity class="interactable builder-action" data-action="spawn" geometry="primitive:plane;width:2.6;height:.42" material="color:#0b5261;emissive:#087888;emissiveIntensity:.4" position="0 .56 .03"><a-entity text="value:+  SPAWN STRUCTURE;align:center;color:#edffff;width:2.25" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="paint" geometry="primitive:plane;width:1.22;height:.38" material="color:#242258;emissive:#553da0;emissiveIntensity:.35" position="-.68 .02 .03"><a-entity text="value:RECOLOR;align:center;color:#edffff;width:1.05" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="delete" geometry="primitive:plane;width:1.22;height:.38" material="color:#48243c;emissive:#9a356a;emissiveIntensity:.3" position=".68 .02 .03"><a-entity text="value:DELETE;align:center;color:#edffff;width:1.05" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="left" geometry="primitive:plane;width:.78;height:.34" material="color:#12314a" position="-.84 -.55 .03"><a-entity text="value:←;align:center;color:#b8f8ff;width:.8" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="forward" geometry="primitive:plane;width:.78;height:.34" material="color:#12314a" position="0 -.55 .03"><a-entity text="value:↑;align:center;color:#b8f8ff;width:.8" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="right" geometry="primitive:plane;width:.78;height:.34" material="color:#12314a" position=".84 -.55 .03"><a-entity text="value:→;align:center;color:#b8f8ff;width:.8" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="up" geometry="primitive:plane;width:1.22;height:.34" material="color:#12314a" position="-.68 -1.02 .03"><a-entity text="value:RAISE;align:center;color:#b8f8ff;width:1.05" position="0 0 .02"></a-entity></a-entity><a-entity class="interactable builder-action" data-action="down" geometry="primitive:plane;width:1.22;height:.34" material="color:#12314a" position=".68 -1.02 .03"><a-entity text="value:LOWER;align:center;color:#b8f8ff;width:1.05" position="0 0 .02"></a-entity><a-entity text="value:SELECT A PIECE TO EDIT;align:center;color:#8ba4bc;width:2.5;letterSpacing:.06" position="0 -1.44 .02"></a-entity></a-entity>
  </a-scene>
  <script>
    AFRAME.registerComponent('free-roam',{schema:{speed:{default:3.1}},init(){this.keys={};this.stick={x:0,z:0};this.down=e=>this.keys[e.code]=true;this.up=e=>this.keys[e.code]=false;window.addEventListener('keydown',this.down);window.addEventListener('keyup',this.up);['left-hand','right-hand'].forEach(id=>document.querySelector('#'+id).addEventListener('axismove',e=>{const a=e.detail.axis||[];if(a.length>=4)this.stick={x:a[2],z:a[3]}}));},tick(_,dt){if(!dt)return;const k=this.keys,s=this.stick;let x=(k.KeyD?1:0)-(k.KeyA?1:0)+s.x,z=(k.KeyS?1:0)-(k.KeyW?1:0)+s.z;if(Math.abs(x)<.12)x=0;if(Math.abs(z)<.12)z=0;if(!x&&!z)return;const yaw=document.querySelector('#head').object3D.rotation.y,scale=this.data.speed*dt/1000;this.el.object3D.position.x+=(x*Math.cos(yaw)+z*Math.sin(yaw))*scale;this.el.object3D.position.z+=(-x*Math.sin(yaw)+z*Math.cos(yaw))*scale;}});
    (()=>{const scene=document.querySelector('#space'),toast=document.querySelector('#toast'),show=m=>{toast.textContent=m;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),2600)};
      const arch=document.querySelector('#hall-architecture');for(let z=5;z>=-145;z-=5){for(const x of[-8.6,8.6]){const p=document.createElement('a-entity');p.setAttribute('geometry','primitive:box;width:.52;height:6.4;depth:.52');p.setAttribute('material','color:#102d47;metalness:.65;roughness:.3;emissive:#063547;emissiveIntensity:.25');p.setAttribute('position',`${x} 3 ${z}`);arch.appendChild(p)}const b=document.createElement('a-entity');b.setAttribute('geometry','primitive:box;width:17.5;height:.18;depth:.24');b.setAttribute('material','color:#174060;metalness:.7;roughness:.3');b.setAttribute('position',`0 5.85 ${z}`);arch.appendChild(b)}
      const stations=document.querySelector('#stations'),seats=[[-3.15,3.55,2],[-3.15,1.1,3],[-3.15,-1.35,4],[-3.15,-3.8,5],[3.15,3.55,6],[3.15,1.1,7],[3.15,-1.35,8]];seats.forEach(([x,z,n])=>{const e=document.createElement('a-entity');e.setAttribute('class','interactable station');e.setAttribute('data-station',n);e.setAttribute('position',`${x} .52 ${z}`);e.setAttribute('rotation',`0 ${x<0?90:-90} 0`);e.innerHTML=`<a-entity geometry="primitive:box;width:1.15;height:.12;depth:.76" material="color:#173754;metalness:.7;roughness:.25"></a-entity><a-entity geometry="primitive:plane;width:.86;height:.42" material="color:#092339;emissive:#086879;emissiveIntensity:.45" position="0 .34 -.15" rotation="-30 0 0"></a-entity><a-entity text="value:STATION ${String(n).padStart(2,'0')};align:center;color:#57f5e2;width:1.25" position="0 .77 -.12" rotation="-55 0 0"></a-entity>`;stations.appendChild(e)});
      const wings=document.querySelector('#wing-rooms');[-1,1].forEach(side=>{const room=document.createElement('a-entity'),x=side*17,label=side<0?'OBSERVATION CONTROL':'SYSTEMS CONTROL',accent=side<0?'#57f5e2':'#9a78ff';room.setAttribute('position',`${x} 0 -4`);room.innerHTML=`<a-entity geometry="primitive:box;width:10;height:6;depth:.18" material="color:#061629;metalness:.55;roughness:.35" position="0 3 -5"></a-entity><a-entity geometry="primitive:box;width:.18;height:6;depth:10" material="color:#07192e;metalness:.5;roughness:.4" position="${side*5} 3 0"></a-entity><a-entity text="value:${label};align:center;color:${accent};width:4.3;letterSpacing:.09" position="0 5.2 -4.86"></a-entity><a-entity geometry="primitive:plane;width:3.3;height:1.8" material="color:#071b32;emissive:${accent};emissiveIntensity:.18" position="0 3.3 -4.84"></a-entity><a-entity text="value:TACTICAL WINDOW\\nFEED STANDBY;align:center;color:#d6f8ff;width:2.8;lineHeight:1.4" position="0 3.35 -4.81"></a-entity><a-entity geometry="primitive:ring;radiusInner:2.7;radiusOuter:2.74" rotation="-90 0 0" material="color:${accent};emissive:${accent};emissiveIntensity:.45" position="0 .02 0"></a-entity>`;wings.appendChild(room)});
      const built=[],palette=['#57f5e2','#9a78ff','#4e8eff','#ff9f68'],selectPiece=piece=>{built.forEach(p=>p.setAttribute('material','emissiveIntensity:.35'));selected=piece;piece.setAttribute('material','emissiveIntensity:1.05');show('Structure selected — use the Builder Console to edit it.')};let selected=null,paintIndex=0;const spawn=()=>{const head=document.querySelector('#head').object3D,origin=new THREE.Vector3(),direction=new THREE.Vector3();head.getWorldPosition(origin);head.getWorldDirection(direction);origin.add(direction.multiplyScalar(3));origin.y=.58;const piece=document.createElement('a-entity'),color=palette[paintIndex++%palette.length];piece.setAttribute('class','interactable build-piece');piece.setAttribute('geometry','primitive:box;width:1.15;height:1.15;depth:1.15');piece.setAttribute('material',`color:${color};metalness:.65;roughness:.25;emissive:${color};emissiveIntensity:.35`);piece.setAttribute('position',`${origin.x} ${origin.y} ${origin.z}`);piece.addEventListener('click',()=>selectPiece(piece));scene.appendChild(piece);built.push(piece);selectPiece(piece);show('New structure placed ahead of you.')};const edit=action=>{if(action==='spawn')return spawn();if(!selected)return show('Select a created structure first.');if(action==='delete'){selected.remove();built.splice(built.indexOf(selected),1);selected=null;return show('Structure removed.')}if(action==='paint'){const c=palette[paintIndex++%palette.length];selected.setAttribute('material',`color:${c};emissive:${c};emissiveIntensity:1.05`);return show('Structure recolored.')}const p=selected.object3D.position,step=.42;if(action==='left')p.x-=step;if(action==='right')p.x+=step;if(action==='forward')p.z-=step;if(action==='up')p.y+=step;if(action==='down')p.y=Math.max(.15,p.y-step);show('Structure moved.');};document.querySelectorAll('.builder-action').forEach(button=>button.addEventListener('click',()=>edit(button.dataset.action)));
      const archive=document.querySelector('#server-archive');for(let z=-17;z>=-145;z-=3.2)for(const x of[-3.5,3.5]){const r=document.createElement('a-entity');r.setAttribute('geometry','primitive:box;width:1.25;height:3.8;depth:1.1');r.setAttribute('material','color:#07172a;metalness:.65;roughness:.3');r.setAttribute('position',`${x} 1.9 ${z}`);archive.appendChild(r);for(let y=.7;y<3.4;y+=.55){const l=document.createElement('a-entity'),c=(Math.round(y*10)+Math.abs(z))%3?'#158a99':'#8c65ff';l.setAttribute('geometry','primitive:plane;width:.78;height:.055');l.setAttribute('material',`color:${c};emissive:${c};emissiveIntensity:.9`);l.setAttribute('position',`${x+(x<0?.63:-.63)} ${y} ${z}`);l.setAttribute('rotation',`0 ${x<0?90:-90} 0`);archive.appendChild(l)}}
      const xr=document.querySelector('#xr-state');if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>xr.textContent=ok?'ready':'unavailable').catch(()=>xr.textContent='unavailable');else xr.textContent='unsupported';document.querySelector('#enter').onclick=()=>scene.enterVR();document.querySelector('#reset').onclick=()=>{document.querySelector('#rig').setAttribute('position','0 0 5.7');const l=document.querySelector('#head').components['look-controls'];l.pitchObject.rotation.set(0,0,0);l.yawObject.rotation.set(0,0,0);show('Returned to your command chair')};scene.addEventListener('enter-vr',()=>document.body.classList.add('vr-active'));scene.addEventListener('exit-vr',()=>document.body.classList.remove('vr-active'));document.querySelectorAll('.destination').forEach(e=>e.addEventListener('click',()=>show(`${e.dataset.destination} is open — walk the illuminated hall.`)));document.querySelectorAll('.station').forEach(e=>e.addEventListener('click',()=>show(`Station ${String(e.dataset.station).padStart(2,'0')} selected — reserved for a future participant.`)));
    })();
  </script>
</body></html>
